name: Build and deploy
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    outputs: { image: "${{ steps.meta.outputs.tags }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cabbit-field-service-api
          tags: type=sha
      - uses: docker/build-push-action@v7
        with: { context: api, push: true, tags: "${{ steps.meta.outputs.tags }}" }
  deploy:
    needs: image
    runs-on: ${{ github.ref_name == 'main' && fromJSON('["self-hosted","linux","production"]') || fromJSON('["self-hosted","linux","staging"]') }}
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with health check and rollback
        env:
          DEPLOY_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          cd /opt/cabbit/repository
          git fetch origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          cd infra
          sed -i "s|^API_IMAGE=.*|API_IMAGE=${DEPLOY_IMAGE%:*}|;s|^APP_VERSION=.*|APP_VERSION=${DEPLOY_IMAGE##*:}|" .env
          ./scripts/deploy.sh

