name: Bug report
description: Report a reproducible product defect
body:
  - type: input
    id: ticket
    attributes: { label: Ticket ID }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual behaviour }
    validations: { required: true }
  - type: textarea
    id: context
    attributes: { label: Device, connectivity, logs and screenshots }

